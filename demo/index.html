<title>墨星占卜台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* 布局：单栏移动优先，顶部品牌 + 两个功能页签；塔罗是“牌桌”，八字是“命盘纸” */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --ink: #1b1a33;
  --muted: #5d5f7a;
  --line: #d6d8e4;
  --brass: #9a7426;
  --seal: #b23a2a;
  --felt: #22204a;
  --felt-ink: #f1ead8;
  --card-back: #2c2960;
  --wood: #4c8a4a; --fire: #c4482f; --earth: #a77b2c; --metal: #8a8fa3; --water: #2f5f9e;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121127; --surface: #1c1b38; --ink: #ece8f6; --muted: #a4a3c2; --line: #34325a;
    --brass: #d8b46a; --seal: #e0614c; --felt: #1a1840; --felt-ink: #f1ead8; --card-back: #34307a;
    --wood: #74b46f; --fire: #ec6f55; --earth: #d2a04c; --metal: #b3b7c9; --water: #6b9be0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121127; --surface: #1c1b38; --ink: #ece8f6; --muted: #a4a3c2; --line: #34325a;
  --brass: #d8b46a; --seal: #e0614c; --felt: #1a1840; --felt-ink: #f1ead8; --card-back: #34307a;
  --wood: #74b46f; --fire: #ec6f55; --earth: #d2a04c; --metal: #b3b7c9; --water: #6b9be0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .seal { width: 34px; height: 34px; border: 2px solid var(--seal); color: var(--seal); display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 18px; border-radius: 4px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 22px; letter-spacing: .08em; }
.brand small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
nav { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
nav a { text-decoration: none; color: var(--muted); padding: 6px 16px; border-radius: 999px; font-weight: 500; }
nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible, .fan .back:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.notice { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--brass); padding: 4px 0 4px 10px; }
h2 { font-family: var(--font-display); font-size: 20px; margin: 0; text-wrap: balance; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
label { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; width: 100%; min-width: 0; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: 14px; padding: 5px 14px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); font-weight: 700; }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 11px 22px; background: var(--ink); color: var(--bg); cursor: pointer; letter-spacing: .06em; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hint { font-size: 13px; color: var(--muted); }

/* 塔罗牌桌 */
.table { background: radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--felt) 80%, var(--brass) 20%), var(--felt) 70%); color: var(--felt-ink); border-radius: 14px; padding: 18px 14px 20px; display: grid; gap: 16px; overflow: hidden; min-width: 0; }
.table .hint { color: color-mix(in srgb, var(--felt-ink) 70%, transparent); text-align: center; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; justify-items: center; }
.slot { display: grid; gap: 8px; justify-items: center; width: 100%; min-width: 0; }
.slot > div:not(.tag) { width: 100%; display: grid; justify-items: center; }
.slot .pos { font-family: var(--font-display); font-size: 13px; letter-spacing: .2em; color: var(--brass); }
.card { width: min(100%, 120px); aspect-ratio: 7 / 12; perspective: 800px; max-width: 100%; }
.card .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.2,.7,.2,1); }
.card.flipped .inner { transform: rotateY(180deg); }
.card .face, .card .backside { position: absolute; inset: 0; border-radius: 9px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.backside, .back { background:
  repeating-linear-gradient(45deg, transparent 0 7px, color-mix(in srgb, var(--brass) 28%, transparent) 7px 8px),
  repeating-linear-gradient(-45deg, transparent 0 7px, color-mix(in srgb, var(--brass) 28%, transparent) 7px 8px),
  var(--card-back);
  border: 2px solid color-mix(in srgb, var(--brass) 70%, transparent); box-shadow: inset 0 0 0 4px var(--card-back), inset 0 0 0 5px color-mix(in srgb, var(--brass) 60%, transparent); }
.slot .empty { width: min(100%, 120px); aspect-ratio: 7 / 12; border: 1.5px dashed color-mix(in srgb, var(--felt-ink) 35%, transparent); border-radius: 9px; }
.face { transform: rotateY(180deg); background: #f4eedf; color: #2a2440; border: 2px solid #b8954b; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding: 8px 4px; font-family: var(--font-display); overflow: hidden; }
.face .num { font-size: 12px; letter-spacing: .1em; color: #7d6330; }
.face .mark { align-self: center; width: 54%; aspect-ratio: 1; border: 2.5px solid #b23a2a; color: #b23a2a; display: grid; place-items: center; font-size: clamp(20px, 7vw, 34px); font-weight: 900; border-radius: 6px; background: radial-gradient(circle, #fbf6ea 55%, #efe3c6); }
.face .nm { font-size: clamp(11px, 3.2vw, 14px); font-weight: 700; white-space: nowrap; }
.face > span:last-child { text-align: center; max-width: 100%; line-height: 1.3; }
.face .en { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-body); font-size: 8.5px; color: #7d6330; letter-spacing: .06em; }
.card.rev .face > * { transform: rotate(180deg); }
.slot .tag { font-size: 12px; line-height: 1.4; text-align: center; min-height: 1.4em; }
.deck-zone { position: relative; height: 185px; display: grid; place-items: center; }
.stack { position: relative; width: 80px; height: 137px; }
.stack .back { position: absolute; inset: 0; border-radius: 8px; }
.fan { position: relative; height: 170px; width: 100%; }
.fan .back { position: absolute; bottom: 10px; width: 62px; height: 106px; border-radius: 7px; cursor: pointer; transform-origin: 50% 100%; transition: transform .35s ease, opacity .35s ease; border-width: 1.5px; }
.fan .back:hover { filter: brightness(1.25); }
.fan .back.taken { opacity: 0; pointer-events: none; }

.reading { display: grid; gap: 12px; }
.reading h3 { margin: 0; font-family: var(--font-display); font-size: 17px; }
.reading p { margin: 0; max-width: 65ch; }
.reading .em { color: var(--brass); font-weight: 700; }
.cursor::after { content: "▍"; color: var(--brass); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* 八字命盘 */
.solar { font-size: 13.5px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 10px 12px; font-variant-numeric: tabular-nums; }
.pillars-wrap { overflow-x: auto; }
table.pillars { border-collapse: collapse; width: 100%; min-width: 0; table-layout: fixed; text-align: center; font-variant-numeric: tabular-nums; }
.pillars th { font-size: 12px; color: var(--muted); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.pillars td { padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.pillars tr > :first-child { width: 2.8em; }
.pillars .hint { font-size: 11.5px; }
.pillars td.big { font-family: var(--font-display); font-size: 26px; font-weight: 900; line-height: 1.2; }
.pillars .rowh { text-align: left; color: var(--muted); font-size: 12px; white-space: nowrap; }
.pillars .day { background: color-mix(in srgb, var(--brass) 10%, transparent); }
.wx-木 { color: var(--wood); } .wx-火 { color: var(--fire); } .wx-土 { color: var(--earth); } .wx-金 { color: var(--metal); } .wx-水 { color: var(--water); }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 2.5em 1fr 3.2em; align-items: center; gap: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.bar .track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 5px; }
.yun { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.yun div { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.yun div b { display: block; font-family: var(--font-display); font-size: 18px; color: var(--ink); }
.yun div.now { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 12%, transparent); }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
footer { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .card .inner, .fan .back { transition: none; } .cursor::after { animation: none; } }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="seal" aria-hidden="true">墨</div>
      <div><h1>墨星占卜台</h1><small>塔罗 · 八字 · 测试版 Demo</small></div>
    </div>
    <nav aria-label="功能">
      <a href="#tarot" id="tab-tarot">塔罗占卜</a>
      <a href="#bazi" id="tab-bazi">八字命盘</a>
    </nav>
  </header>
  <p class="notice">这是产品演示版。排盘为真实算法（lunar-javascript），解读暂由规则模板拼接，正式版将改为 AI 个性化生成。内容仅供娱乐参考。</p>

  <!-- 塔罗 -->
  <section id="view-tarot" class="view" aria-labelledby="tarot-h">
    <div class="panel">
      <h2 id="tarot-h">三张牌 · 过去 现在 未来</h2>
      <label for="q">你想问的事
        <input id="q" maxlength="60" value="最近和他有点冷淡，接下来会怎样？">
      </label>
      <div class="chips" role="group" aria-label="问题类型" id="scenes">
        <button class="chip" data-scene="love" aria-pressed="true">感情</button>
        <button class="chip" data-scene="work" aria-pressed="false">事业学业</button>
        <button class="chip" data-scene="money" aria-pressed="false">财运</button>
        <button class="chip" data-scene="self" aria-pressed="false">自我成长</button>
      </div>
      <div class="table" id="table">
        <div class="slots" id="slots"></div>
        <div class="deck-zone" id="deckzone">
          <div class="stack" id="stack"></div>
          <div class="fan" id="fan" hidden></div>
        </div>
        <p class="hint" id="thint">想着你的问题，点“洗牌”，再从牌堆里凭直觉选三张。</p>
      </div>
      <div class="actions">
        <button class="btn" id="shuffle">洗牌</button>
        <button class="btn ghost" id="reset" hidden>重新开始</button>
        <button class="btn ghost" id="skip" hidden>直接显示全文</button>
      </div>
    </div>
    <div class="panel reading" id="reading" hidden aria-live="polite"></div>
  </section>

  <!-- 八字 -->
  <section id="view-bazi" class="view" aria-labelledby="bazi-h" hidden>
    <form class="panel" id="bform">
      <h2 id="bazi-h">八字命盘</h2>
      <div class="row">
        <label for="bdate">出生日期（公历）<input type="date" id="bdate" value="1998-08-16" min="1901-01-01" max="2099-12-31" required></label>
        <label for="btime">出生时间<input type="time" id="btime" value="09:30" required></label>
        <label for="bgender">性别<select id="bgender"><option value="0">女</option><option value="1">男</option></select></label>
        <label for="bcity">出生城市<select id="bcity"></select></label>
      </div>
      <div class="row">
        <label for="bsolar">时间校正<select id="bsolar"><option value="1">真太阳时（推荐）</option><option value="0">北京时间</option></select></label>
        <label for="bsect">子时流派<select id="bsect"><option value="1">23:00 换日</option><option value="2">00:00 换日</option></select></label>
      </div>
      <div class="actions"><button class="btn" type="submit">排盘</button><span class="hint">示例生辰已填好，可直接修改。</span></div>
    </form>
    <div id="bout" class="reading" style="display:grid;gap:20px;margin-top:20px"></div>
  </section>

  <footer>Demo · 牌面为原创印章式设计，未使用受版权保护的牌面图像</footer>
</div>

    var out = $("bout");
    if (typeof Solar === "undefined") { out.innerHTML = '<div class="panel">排盘库没有加载成功，请检查网络后刷新页面。</div>'; return; }
    var ds = $("bdate").value, ts = $("btime").value;
    if (!ds || !ts) { out.innerHTML = '<div class="panel">请填写完整的出生日期和时间。</div>'; return; }
    var y = +ds.slice(0, 4), m = +ds.slice(5, 7), d = +ds.slice(8, 10), hh = +ts.slice(0, 2), mi = +ts.slice(3, 5);
    var city = CITIES[+$("bcity").value], useSolar = $("bsolar").value === "1", sect = +$("bsect").value, gender = +$("bgender").value;
    var dst = inDST(y, ds.slice(5)) && hh >= 2;
    var lonMin = (city[1] - 120) * 4, eq = eot(y, m, d);
    var shift = (dst ? -60 : 0) + (useSolar ? lonMin + eq : 0);
    var t = new Date(Date.UTC(y, m - 1, d, hh, mi) + Math.round(shift) * 60000);
    var Y = t.getUTCFullYear(), M = t.getUTCMonth() + 1, D = t.getUTCDate(), H = t.getUTCHours(), MI = t.getUTCMinutes();

    var lunar = Solar.fromYmdHms(Y, M, D, H, MI, 0).getLunar();
    var ec = lunar.getEightChar(); ec.setSect(sect);
    var dg = ec.getDayGan();
    var cols = [
      ["年柱", ec.getYearGan(), ec.getYearZhi(), ec.getYearHideGan(), ec.getYearNaYin()],
      ["月柱", ec.getMonthGan(), ec.getMonthZhi(), ec.getMonthHideGan(), ec.getMonthNaYin()],
      ["日柱", ec.getDayGan(), ec.getDayZhi(), ec.getDayHideGan(), ec.getDayNaYin()],
      ["时柱", ec.getTimeGan(), ec.getTimeZhi(), ec.getTimeHideGan(), ec.getTimeNaYin()]
    ];

    // 五行力量（简化：天干 1，地支本气 1，其余藏干 0.3；月令本气加 0.5）
    var score = { 木: 0, 火: 0, 土: 0, 金: 0, 水: 0 };
    cols.forEach(function (c, i) {
      score[GAN_WX[c[1]]] += 1;
      c[3].forEach(function (h, k) { score[GAN_WX[h]] += k === 0 ? (i === 1 ? 1.5 : 1) : 0.3; });
    });
    var total = ORDER.reduce(function (s, k) { return s + score[k]; }, 0);
    var me = GAN_WX[dg], mother = ORDER[(ORDER.indexOf(me) + 4) % 5];
    var support = score[me] + score[mother];
    var strong = support / total >= 0.45;
    var favor = strong ? [gen(me), ctrl(me)] : [mother, me];
    var weakest = ORDER.slice().sort(function (a, b) { return score[a] - score[b]; })[0];

    var yun = ec.getYun(gender), dys = yun.getDaYun().slice(1, 9), nowY = new Date().getFullYear();
    var cur = dys.filter(function (x) { return nowY >= x.getStartYear() && nowY <= x.getEndYear(); })[0];

    var timeLine = "北京时间 " + ds + " " + ts;
    if (dst) timeLine += "，当年处于夏令时，先减 1 小时";
    if (useSolar) timeLine += "；" + city[0] + "经度修正 " + (lonMin >= 0 ? "+" : "") + lonMin.toFixed(0) + " 分，均时差 " + (eq >= 0 ? "+" : "") + eq.toFixed(0) + " 分";
    timeLine += "。排盘时间：<b>" + Y + "-" + pad(M) + "-" + pad(D) + " " + pad(H) + ":" + pad(MI) + "</b>（农历" + lunar.getYearInChinese() + "年" + lunar.getMonthInChinese() + "月" + lunar.getDayInChinese() + "，" + lunar.getTimeZhi() + "时）";

    function cell(ch) { return '<span class="wx-' + (GAN_WX[ch] || ZHI_WX[ch]) + '">' + ch + "</span>"; }
    var th = '<tr><th></th>' + cols.map(function (c, i) { return '<th class="' + (i === 2 ? "day" : "") + '">' + c[0] + "</th>"; }).join("") + "</tr>";
    var r1 = '<tr><td class="rowh">十神</td>' + cols.map(function (c, i) { return '<td class="' + (i === 2 ? "day" : "") + '">' + (i === 2 ? "日主" : shishen(dg, c[1])) + "</td>"; }).join("") + "</tr>";
    var r2 = '<tr><td class="rowh">天干</td>' + cols.map(function (c, i) { return '<td class="big ' + (i === 2 ? "day" : "") + '">' + cell(c[1]) + "</td>"; }).join("") + "</tr>";
    var r3 = '<tr><td class="rowh">地支</td>' + cols.map(function (c, i) { return '<td class="big ' + (i === 2 ? "day" : "") + '">' + cell(c[2]) + "</td>"; }).join("") + "</tr>";
    var r4 = '<tr><td class="rowh">藏干</td>' + cols.map(function (c, i) { return '<td class="' + (i === 2 ? "day" : "") + '">' + c[3].map(function (h) { return cell(h) + '<span class="hint">' + shishen(dg, h) + "</span>"; }).join("<br>") + "</td>"; }).join("") + "</tr>";
    var r5 = '<tr><td class="rowh">纳音</td>' + cols.map(function (c, i) { return '<td class="' + (i === 2 ? "day" : "") + '">' + c[4] + "</td>"; }).join("") + "</tr>";

    var colorVar = { 木: "--wood", 火: "--fire", 土: "--earth", 金: "--metal", 水: "--water" };
    var bars = ORDER.map(function (k) {
      var pct = score[k] / total * 100;
      return '<div class="bar"><span class="wx-' + k + '"><b>' + k + '</b></span><div class="track"><div class="fill" style="width:' + pct.toFixed(0) + "%;background:var(" + colorVar[k] + ')"></div></div><span>' + pct.toFixed(0) + "%</span></div>";
    }).join("");

    var yunHtml = dys.map(function (x) {
      return '<div class="' + (x === cur ? "now" : "") + '"><b>' + x.getGanZhi() + "</b>" + x.getStartYear() + " 年起<br>" + x.getStartAge() + " 岁</div>";
    }).join("");

    var curText = cur ? "你现在走的是「" + cur.getGanZhi() + "」大运（" + cur.getStartYear() + "–" + cur.getEndYear() + "），天干" + cur.getGanZhi().charAt(0) + "对你来说是" + shishen(dg, cur.getGanZhi().charAt(0)) + "。" + (favor.indexOf(GAN_WX[cur.getGanZhi().charAt(0)]) >= 0 ? "这步运的天干正是你喜欢的五行，这十年适合主动争取。" : "这步运的天干不在你的喜用五行里，更适合稳扎稳打、积累实力。") : "当前年份还没进入第一步大运，现在主要看原局和流年。";

    out.innerHTML =
      '<div class="panel"><h2>' + lunar.getYearInGanZhi() + "年 · " + (gender ? "乾造（男）" : "坤造（女）") + '</h2><div class="solar">' + timeLine + "</div>" +
      '<div class="pillars-wrap"><table class="pillars">' + th + r1 + r2 + r3 + r4 + r5 + "</table></div>" +
      '<p class="hint">起运：出生后 ' + yun.getStartYear() + " 年 " + yun.getStartMonth() + " 个月 " + yun.getStartDay() + " 天，" + (GAN_YANG[ec.getYearGan()] === gender ? "顺排" : "逆排") + "。</p></div>" +
      '<div class="panel"><h3>五行力量</h3><div class="bars">' + bars + '</div><p class="hint">日主' + dg + me + "，同类与生扶力量约占 " + (support / total * 100).toFixed(0) + "%，判断为身" + (strong ? "偏强" : "偏弱") + "，喜用 " + favor.join("、") + "。（Demo 为简化算法，正式版按《子平真诠》《滴天髓》《穷通宝鉴》规则引擎判断）</p></div>" +
      '<div class="panel"><h3>大运</h3><div class="yun">' + yunHtml + "</div></div>" +
      '<div class="panel"><h3>简批</h3>' +
      "<p>你的日主是<span class=\"em\">" + dg + me + "</span>，" + DM[dg] + "</p>" +
      "<p>" + (strong ? "命局里" + me + "的力量偏足，精力和主见都不缺，反而要找地方把劲使出去。" + favor[0] + "代表你的表达与才华，" + favor[1] + "代表你能抓住的资源，这两样多用起来，运势会更顺。" : "命局里" + me + "的力量偏弱，做事前容易先担心，需要外界的支持帮你托底。" + favor[0] + "是贵人和学习，" + favor[1] + "是朋友和同伴，多依靠它们，你会走得更稳。") + "</p>" +
      "<p>五行里最少的是<span class=\"em\">" + weakest + "</span>。" + WXTIP[weakest] + "</p>" +
      "<p>" + curText + "</p>" +
      '<details><summary>完整命书包含哪些内容（正式版付费）</summary><p class="hint">性格深度分析、事业方向、感情与婚恋、财运结构、健康提醒、未来十年逐年流年详批，以及可随时追问的 AI 命理师。</p></details></div>';
  }
  $("bform").addEventListener("submit", calc);
  if (document.readyState === "complete") calc(); else window.addEventListener("load", function () { calc(); });
})();
</script>
