# 本地或单机部署：docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moxing
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moxing}
      POSTGRES_DB: moxing
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  web:
    build: .
    env_file: apps/web/.env
    environment:
      DATABASE_URL: postgresql://moxing:${DB_PASSWORD:-moxing}@db:5432/moxing
    ports: ["3000:3000"]
    depends_on: [db]
    restart: unless-stopped
volumes:
  pgdata:
